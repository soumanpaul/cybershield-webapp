services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cybershield
      POSTGRES_PASSWORD: cybershield
      POSTGRES_DB: cybershield
    ports:
      - "5432:5432"
    volumes:
      - cybershield_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cybershield_pg_data:
